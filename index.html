<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Maniquí Saltarín</title>
<meta name="description" content="Plataformero 3D: un maniquí en T-pose se mueve y salta entre plataformas móviles.">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0d1117;
  --panel:#141a22;
  --panel-border:#2a323c;
  --fg:#c9d1d9;
  --fg-dim:#7d8794;
  --accent:#ff8a3d;
  --accent-soft:#ffb37a;
  --ok:#3ddc84;
  --font-display:'Chakra Petch', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
  color-scheme: dark;
}
[hidden]{ display:none !important; }
html, body{ height:100%; margin:0; }
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font-mono);
  overflow:hidden;
}
#app{ display:flex; flex-direction:column; height:100%; }
header#hud{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--panel-border);
  flex:0 0 auto;
}
.hud-left{ display:flex; flex-direction:column; gap:1px; min-width:0; }
.eyebrow{ font-size:.6rem; color:var(--accent); letter-spacing:.12em; font-family:var(--font-mono); }
.hud-title{ font-family:var(--font-display); font-weight:700; font-size:1.02rem; letter-spacing:.01em; color:var(--fg); white-space:nowrap; }
.hud-right{ display:flex; align-items:center; gap:16px; flex:0 0 auto; }
.hud-stat{ display:flex; flex-direction:column; align-items:flex-end; line-height:1.15; }
.hud-stat .k{ font-size:.58rem; color:var(--fg-dim); letter-spacing:.08em; text-transform:uppercase; }
.hud-stat .v{ font-variant-numeric:tabular-nums; font-weight:600; color:var(--accent-soft); font-size:.92rem; }
#viewport{ position:relative; flex:1 1 auto; min-height:0; background:var(--bg); }
#scene{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
#controls{ position:absolute; inset:0; pointer-events:none; }
#stick-base{ position:absolute; left:20px; bottom:20px; width:108px; height:108px; border-radius:50%; background:rgba(20,26,34,.55); border:1px solid var(--panel-border); pointer-events:auto; touch-action:none; }
#stick-thumb{ position:absolute; left:50%; top:50%; width:46px; height:46px; border-radius:50%; background:rgba(255,138,61,.85); transform:translate(-50%,-50%); }
#jump-btn{ position:absolute; right:22px; bottom:24px; width:78px; height:78px; border-radius:50%; background:rgba(61,220,132,.18); border:1px solid rgba(61,220,132,.5); color:var(--ok); font-family:var(--font-mono); font-size:.66rem; letter-spacing:.08em; display:flex; align-items:center; justify-content:center; pointer-events:auto; touch-action:none; user-select:none; }
#jump-btn.pressed{ background:rgba(61,220,132,.42); }
#hint{ position:absolute; left:16px; top:14px; font-size:.62rem; letter-spacing:.04em; color:var(--fg-dim); background:rgba(20,26,34,.5); padding:4px 9px; border-radius:999px; pointer-events:none; display:none; }
@media (pointer:fine){ #hint{ display:block; } }
#toast{ position:absolute; top:14px; left:50%; transform:translateX(-50%) translateY(-8px); background:var(--panel); border:1px solid var(--panel-border); padding:6px 14px; border-radius:999px; font-size:.72rem; letter-spacing:.04em; color:var(--accent-soft); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
#overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(10,13,17,.72); }
#overlay .panel{ background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:22px 26px; text-align:center; max-width:280px; }
#overlay h2{ font-family:var(--font-display); margin:0 0 6px; color:var(--ok); font-size:1.15rem; }
#overlay p{ margin:0 0 16px; color:var(--fg-dim); font-size:.85rem; }
#overlay button{ font-family:var(--font-mono); background:var(--accent); color:#1a1206; border:none; padding:10px 18px; border-radius:6px; font-weight:600; font-size:.8rem; letter-spacing:.02em; cursor:pointer; }
</style>
</head>
<body>

<div id="app">
  <header id="hud">
    <div class="hud-left">
      <span class="eyebrow">BLOCKOUT · BUILD 0.1</span>
      <span class="hud-title">Maniquí Saltarín</span>
    </div>
    <div class="hud-right">
      <div class="hud-stat"><span class="k">Tiempo</span><span class="v" id="hud-timer">0:00.00</span></div>
      <div class="hud-stat"><span class="k">Checkpoint</span><span class="v" id="hud-cp">CP 0/7</span></div>
    </div>
  </header>

  <div id="viewport">
    <canvas id="scene"></canvas>
    <div id="hint">WASD / flechas · espacio = saltar</div>
    <div id="toast"></div>
    <div id="controls">
      <div id="stick-base"><div id="stick-thumb"></div></div>
      <div id="jump-btn">SALTO</div>
    </div>
    <div id="overlay" hidden>
      <div class="panel">
        <h2 id="overlay-title">Meta alcanzada</h2>
        <p id="overlay-body">Tiempo: 0:00.00</p>
        <button id="overlay-btn">Reiniciar recorrido</button>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const GRAVITY = -24;
const JUMP_SPEED = 9.2;
const MOVE_ACCEL = 34;
const MAX_SPEED = 6;
const KILL_Y = -14;
const COYOTE_TIME = 0.12;
const JUMP_BUFFER = 0.12;
const PLAYER_RADIUS = 0.42;
const BG_COLOR = 0x0d1117;

const LEVEL = [
  { x: 0, y: 0, z: 0, w: 4.2, d: 4.2, kind: 'start' },
  { x: 0, y: 0, z: -6.2, w: 2.6, d: 2.6, kind: 'static' },
  { x: 3.6, y: 0.4, z: -10.6, w: 2.2, d: 2.2, axis: 'x', amp: 1.6, speed: 1.1, phase: 0, kind: 'move' },
  { x: 3.6, y: 1.6, z: -15.2, w: 2.0, d: 2.0, axis: 'y', amp: 1.0, speed: 1.4, phase: 1.3, kind: 'move' },
  { x: 0.4, y: 2.6, z: -19.4, w: 2.4, d: 2.4, kind: 'static' },
  { x: 0.4, y: 2.6, z: -24.6, w: 2.0, d: 2.0, axis: 'z', amp: 1.8, speed: 1.0, phase: 0.6, kind: 'move' },
  { x: 0.4, y: 3.4, z: -29.6, w: 2.4, d: 2.4, kind: 'static' },
  { x: 0.4, y: 3.4, z: -34.4, w: 4.6, d: 4.6, kind: 'goal' },
];

function lerpAngle(a, b, t) {
  let diff = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
  if (diff < -Math.PI) diff += Math.PI * 2;
  return a + diff * t;
}

function makeGridTexture(line, fill) {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = fill;
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = line;
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, size - 3, size - 3);
  ctx.beginPath();
  ctx.moveTo(size / 2, 0);
  ctx.lineTo(size / 2, size);
  ctx.moveTo(0, size / 2);
  ctx.lineTo(size, size / 2);
  ctx.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function buildPlayer() {
  const group = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({ color: 0xc9d1d9, roughness: 0.75, metalness: 0.05 });
  const mark = new THREE.MeshStandardMaterial({ color: 0xff8a3d, roughness: 0.5 });

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.62, 0.26), skin);
  torso.position.y = 1.07;
  group.add(torso);

  const chip = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.12, 4), mark);
  chip.position.set(0, 1.12, 0.14);
  chip.rotation.x = Math.PI / 2;
  group.add(chip);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12), skin);
  head.position.y = 1.62;
  group.add(head);

  const armGeo = new THREE.BoxGeometry(0.78, 0.16, 0.16);
  const armL = new THREE.Mesh(armGeo, skin);
  armL.position.set(0.62, 1.22, 0);
  group.add(armL);
  const armR = new THREE.Mesh(armGeo, skin);
  armR.position.set(-0.62, 1.22, 0);
  group.add(armR);

  const legGeo = new THREE.BoxGeometry(0.18, 1.02, 0.2);
  const legL = new THREE.Mesh(legGeo, skin);
  legL.position.set(0.12, 0.51, 0);
  group.add(legL);
  const legR = new THREE.Mesh(legGeo, skin);
  legR.position.set(-0.12, 0.51, 0);
  group.add(legR);

  return group;
}

function start(initial) {
  const canvas = document.querySelector('#scene');
  const viewport = document.querySelector('#viewport');
  const hudTimer = document.querySelector('#hud-timer');
  const hudCheckpoint = document.querySelector('#hud-cp');
  const overlay = document.querySelector('#overlay');
  const overlayTitle = document.querySelector('#overlay-title');
  const overlayBody = document.querySelector('#overlay-body');
  const overlayBtn = document.querySelector('#overlay-btn');
  const toast = document.querySelector('#toast');

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG_COLOR);
  scene.fog = new THREE.Fog(BG_COLOR, 18, 56);

  const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 200);

  const hemi = new THREE.HemisphereLight(0x9fb4c9, 0x14181f, 0.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(6, 10, 4);
  scene.add(sun);

  const gridTexStatic = makeGridTexture('#2d3340', '#49536a');
  const gridTexMove = makeGridTexture('#6b4a2c', '#8a6239');
  const gridTexGoal = makeGridTexture('#1f4d38', '#2fae7d');

  const platforms = LEVEL.map((def, index) => {
    const h = 0.6;
    const mat = new THREE.MeshStandardMaterial({
      map: def.kind === 'goal' ? gridTexGoal : def.kind === 'move' ? gridTexMove : gridTexStatic,
      roughness: 0.9,
    });
    mat.map.repeat.set(Math.max(1, def.w / 1.4), Math.max(1, def.d / 1.4));
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(def.w, h, def.d), mat);
    mesh.position.set(def.x, def.y - h / 2, def.z);
    scene.add(mesh);

    if (def.kind === 'move') {
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(mesh.geometry),
        new THREE.LineBasicMaterial({ color: 0xff8a3d })
      );
      mesh.add(edges);
    }

    let marker = null;
    if (def.kind === 'goal') {
      marker = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.4, 0),
        new THREE.MeshStandardMaterial({ color: 0x3ddc84, emissive: 0x114a2f, roughness: 0.3 })
      );
      marker.position.set(def.x, def.y + 1.4, def.z);
      scene.add(marker);
    }

    return {
      def, index, mesh, marker,
      center: new THREE.Vector3(def.x, def.y, def.z),
      prevCenter: new THREE.Vector3(def.x, def.y, def.z),
    };
  });

  function updatePlatforms(t) {
    for (const p of platforms) {
      p.prevCenter.copy(p.center);
      const d = p.def;
      let x = d.x, y = d.y, z = d.z;
      if (d.axis === 'x') x += Math.sin(t * d.speed + (d.phase || 0)) * d.amp;
      if (d.axis === 'y') y += Math.sin(t * d.speed + (d.phase || 0)) * d.amp;
      if (d.axis === 'z') z += Math.sin(t * d.speed + (d.phase || 0)) * d.amp;
      p.center.set(x, y, z);
      p.mesh.position.set(x, y - 0.3, z);
      if (p.marker) {
        p.marker.position.set(x, y + 1.4, z);
        p.marker.rotation.y = t * 0.8;
      }
    }
  }

  const player = buildPlayer();
  scene.add(player);

  const spawnFirst = new THREE.Vector3(LEVEL[0].x, LEVEL[0].y, LEVEL[0].z);
  const state = {
    pos: new THREE.Vector3().copy(initial.pos || spawnFirst),
    vel: new THREE.Vector3().copy(initial.vel || new THREE.Vector3()),
    facing: initial.facing ?? 0,
    camYaw: initial.camYaw ?? 0,
    grounded: false,
    standing: -1,
    coyote: 0,
    jumpBuffer: 0,
    checkpoint: initial.checkpoint ?? 0,
    spawn: new THREE.Vector3().copy(initial.spawn || spawnFirst),
    elapsed: initial.elapsed ?? 0,
    goal: initial.goal ?? false,
    timerRunning: !(initial.goal ?? false),
  };

  const keys = Object.create(null);
  let jumpPressedEdge = false;
  window.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space' && state.goal) { resetRun(); return; }
    if (e.code === 'Space' && !keys[e.code]) jumpPressedEdge = true;
    keys[e.code] = true;
  }, { passive: false });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  function keyAxis() {
    let x = 0, y = 0;
    if (keys.ArrowLeft || keys.KeyA) x -= 1;
    if (keys.ArrowRight || keys.KeyD) x += 1;
    if (keys.ArrowUp || keys.KeyW) y += 1;
    if (keys.ArrowDown || keys.KeyS) y -= 1;
    return { x, y };
  }

  const stick = document.querySelector('#stick-base');
  const stickThumb = document.querySelector('#stick-thumb');
  const jumpBtn = document.querySelector('#jump-btn');
  let stickTouchId = null;
  let stickVec = { x: 0, y: 0 };

  function updateStick(e) {
    const r = stick.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const max = r.width / 2;
    const len = Math.hypot(dx, dy) || 1;
    const clamped = Math.min(len, max);
    dx = (dx / len) * clamped;
    dy = (dy / len) * clamped;
    stickThumb.style.transform = `translate(${dx}px, ${dy}px) translate(-50%, -50%)`;
    stickVec = { x: dx / max, y: -dy / max };
  }
  function endStick(e) {
    if (e.pointerId !== stickTouchId) return;
    stickTouchId = null;
    stickVec = { x: 0, y: 0 };
    stickThumb.style.transform = 'translate(-50%, -50%)';
  }
  stick.addEventListener('pointerdown', (e) => {
    stickTouchId = e.pointerId;
    stick.setPointerCapture(e.pointerId);
    updateStick(e);
  });
  stick.addEventListener('pointermove', (e) => { if (e.pointerId === stickTouchId) updateStick(e); });
  stick.addEventListener('pointerup', endStick);
  stick.addEventListener('pointercancel', endStick);

  jumpBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state.goal) { resetRun(); return; }
    jumpPressedEdge = true;
    jumpBtn.classList.add('pressed');
  });
  jumpBtn.addEventListener('pointerup', () => jumpBtn.classList.remove('pressed'));
  jumpBtn.addEventListener('pointercancel', () => jumpBtn.classList.remove('pressed'));

  function resize() {
    const w = viewport.clientWidth;
    const h = viewport.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1400);
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = (s - m * 60).toFixed(2).padStart(5, '0');
    return `${m}:${sec}`;
  }

  function resetRun() {
    state.pos.copy(spawnFirst);
    state.vel.set(0, 0, 0);
    state.checkpoint = 0;
    state.spawn.copy(spawnFirst);
    state.elapsed = 0;
    state.goal = false;
    state.timerRunning = true;
    overlay.hidden = true;
  }
  overlayBtn.addEventListener('click', resetRun);
  overlay.addEventListener('click', resetRun); // tapping anywhere on the panel also gets you out

  const clock = new THREE.Clock();
  const camPos = new THREE.Vector3(spawnFirst.x, spawnFirst.y + 3.2, spawnFirst.z + 7);
  const camLook = new THREE.Vector3();

  function step() {
    const dt = Math.min(clock.getDelta(), 1 / 30);
    const t = clock.elapsedTime;
    updatePlatforms(t);

    const kx = keyAxis();
    const ix = THREE.MathUtils.clamp(kx.x + stickVec.x, -1, 1);
    const iy = THREE.MathUtils.clamp(kx.y + stickVec.y, -1, 1);
    const mag = Math.min(1, Math.hypot(ix, iy));

    if (!state.goal) {
      const forward = new THREE.Vector3(Math.sin(state.camYaw), 0, Math.cos(state.camYaw));
      const right = new THREE.Vector3(Math.sin(state.camYaw + Math.PI / 2), 0, Math.cos(state.camYaw + Math.PI / 2));
      const wish = new THREE.Vector3().addScaledVector(right, ix).addScaledVector(forward, iy);
      if (wish.lengthSq() > 1) wish.normalize();
      const targetVel = wish.multiplyScalar(MAX_SPEED);

      state.vel.x = THREE.MathUtils.damp(state.vel.x, targetVel.x, MOVE_ACCEL / MAX_SPEED, dt);
      state.vel.z = THREE.MathUtils.damp(state.vel.z, targetVel.z, MOVE_ACCEL / MAX_SPEED, dt);

      if (mag > 0.12) {
        const targetFacing = Math.atan2(state.vel.x, state.vel.z);
        state.facing = lerpAngle(state.facing, targetFacing, Math.min(1, dt * 10));
        state.camYaw = lerpAngle(state.camYaw, targetFacing, Math.min(1, dt * 1.6));
      }

      if (jumpPressedEdge) state.jumpBuffer = JUMP_BUFFER;
      jumpPressedEdge = false;
      state.jumpBuffer = Math.max(0, state.jumpBuffer - dt);
      state.coyote = Math.max(0, state.coyote - dt);

      if (state.jumpBuffer > 0 && (state.grounded || state.coyote > 0)) {
        state.vel.y = JUMP_SPEED;
        state.grounded = false;
        state.coyote = 0;
        state.jumpBuffer = 0;
        state.standing = -1;
      }

      state.vel.y += GRAVITY * dt;
      state.pos.x += state.vel.x * dt;
      state.pos.y += state.vel.y * dt;
      state.pos.z += state.vel.z * dt;

      let landed = false;
      for (const p of platforms) {
        const hx = p.def.w / 2 + PLAYER_RADIUS * 0.4;
        const hz = p.def.d / 2 + PLAYER_RADIUS * 0.4;
        if (Math.abs(state.pos.x - p.center.x) > hx) continue;
        if (Math.abs(state.pos.z - p.center.z) > hz) continue;
        const top = p.center.y;
        if (state.vel.y <= 0.001 && state.pos.y <= top + 0.32 && state.pos.y >= top - 0.4) {
          state.pos.y = top;
          state.vel.y = 0;
          state.grounded = true;
          state.coyote = COYOTE_TIME;
          state.standing = p.index;
          landed = true;
          if (p.index > state.checkpoint) {
            state.checkpoint = p.index;
            state.spawn.set(p.center.x, top + 0.02, p.center.z);
            showToast('Checkpoint');
          }
          if (p.def.kind === 'goal' && !state.goal) {
            state.goal = true;
            state.timerRunning = false;
            overlayTitle.textContent = 'Meta alcanzada';
            overlayBody.textContent = `Tiempo: ${formatTime(state.elapsed)}`;
            overlayBtn.textContent = 'Reiniciar recorrido';
            overlay.hidden = false;
          }
          break;
        }
      }
      if (!landed) state.grounded = false;

      const standingPlatform = platforms[state.standing];
      if (state.grounded && standingPlatform) {
        const delta = new THREE.Vector3().subVectors(standingPlatform.center, standingPlatform.prevCenter);
        state.pos.x += delta.x;
        state.pos.z += delta.z;
      }

      if (state.pos.y < KILL_Y) {
        state.pos.copy(state.spawn);
        state.vel.set(0, 0, 0);
        showToast('Reapareciste');
      }
    }

    if (state.timerRunning) state.elapsed += dt;
    hudTimer.textContent = formatTime(state.elapsed);
    hudCheckpoint.textContent = `CP ${state.checkpoint}/${platforms.length - 1}`;

    player.position.copy(state.pos);
    player.rotation.y = state.facing;

    const camDist = 6.6, camHeight = 3.1;
    const behind = new THREE.Vector3(-Math.sin(state.camYaw), 0, -Math.cos(state.camYaw)).multiplyScalar(camDist);
    const targetCamPos = new THREE.Vector3().copy(state.pos).add(behind).add(new THREE.Vector3(0, camHeight, 0));
    camPos.lerp(targetCamPos, Math.min(1, dt * 4));
    camera.position.copy(camPos);
    camLook.copy(state.pos).add(new THREE.Vector3(0, 1.1, 0));
    camera.lookAt(camLook);

    renderer.render(scene, camera);
    requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}

start({});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
